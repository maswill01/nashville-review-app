<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1c1917" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Nashville List</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <h1>
        <button type="button" class="list-switch" id="list-switch"
                aria-haspopup="dialog" aria-expanded="false">
          <span id="list-owner">Nashville</span><span class="caret" aria-hidden="true">▾</span>
        </button>
      </h1>
      <div class="topbar-actions">
        <span class="stat" id="stat-line">—</span>
        <button class="icon-btn" id="logout-btn" title="Log out" aria-label="Log out">⏻</button>
      </div>
    </div>

    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search places, notes, tags…" autocomplete="off" />
    </div>

    <div class="tabs" role="tablist">
      <button class="tab is-active" data-status="visited" role="tab">Been</button>
      <button class="tab" data-status="wishlist" role="tab">Want to go</button>
      <button class="tab" data-status="" role="tab">All</button>
    </div>

    <div class="chips" id="category-chips">
      <button class="chip is-active" data-category="">All</button>
      <button class="chip" data-category="restaurant">Restaurants</button>
      <button class="chip" data-category="breakfast">Breakfast</button>
      <button class="chip" data-category="bar">Bars</button>
      <button class="chip" data-category="coffee">Coffee</button>
      <button class="chip" data-category="music">Music</button>
      <button class="chip" data-category="activity">Activities</button>
      <button class="chip" data-category="shop">Shops</button>
      <button class="chip" data-category="other">Other</button>
    </div>
  </header>

  <main>
    <div class="sort-row">
      <label for="sort">Sort</label>
      <select id="sort">
        <option value="recent">Recently added</option>
        <option value="rating">Highest rated</option>
        <option value="visited">Date visited</option>
        <option value="name">Name</option>
      </select>
    </div>

    <div id="list" class="list"></div>
    <p id="empty" class="empty" hidden></p>
  </main>

  <button class="fab" id="add-btn" aria-label="Add a place">+</button>

  <div class="sheet-backdrop" id="sheet" hidden>
    <form class="sheet" id="place-form" novalidate>
      <div class="sheet-head">
        <button type="button" class="link-btn" id="cancel-btn">Cancel</button>
        <strong id="sheet-title">New place</strong>
        <button type="submit" class="link-btn strong" id="save-btn">Save</button>
      </div>

      <div class="sheet-body">
        <input type="hidden" id="f-id" />
        <input type="hidden" id="f-lat" />
        <input type="hidden" id="f-lng" />
        <input type="hidden" id="f-place-id" />
        <input type="hidden" id="f-place-provider" />

        <!-- Status comes first: it decides which fields below are shown at all. -->
        <div class="field-row">
          <label class="field">
            <span>Status</span>
            <select id="f-status">
              <option value="visited">Been there</option>
              <option value="wishlist">Want to go</option>
            </select>
          </label>
          <label class="field">
            <span>Type</span>
            <select id="f-category">
              <option value="restaurant">Restaurant</option>
              <option value="breakfast">Breakfast / brunch</option>
              <option value="bar">Bar</option>
              <option value="coffee">Coffee</option>
              <option value="music">Music venue</option>
              <option value="activity">Activity</option>
              <option value="shop">Shop</option>
              <option value="other">Other</option>
            </select>
          </label>
        </div>

        <div class="field">
          <span class="field-label" id="f-name-label">Place</span>
          <div class="lookup" id="place-lookup">
            <input id="f-name" type="text" required autocomplete="off" autocorrect="off"
                   spellcheck="false" role="combobox" aria-expanded="false"
                   aria-controls="place-results" aria-autocomplete="list"
                   placeholder="Search for a place…" />
            <span class="lookup-spinner" id="place-spinner" hidden aria-hidden="true"></span>
            <ul class="lookup-menu" id="place-results" role="listbox" hidden></ul>
          </div>
          <p class="hint" id="place-hint" hidden></p>
        </div>

        <label class="field">
          <span>Address</span>
          <input id="f-address" type="text" autocomplete="off" placeholder="Filled in when you pick a place" />
        </label>

        <div class="field">
          <span class="field-label">Neighborhood</span>
          <select id="f-neighborhood"></select>
          <input id="f-neighborhood-custom" type="text" placeholder="Type the neighborhood" hidden />
        </div>

        <div class="field">
          <span class="field-label">Price</span>
          <div class="segmented" id="f-price">
            <button type="button" data-value="1">$</button>
            <button type="button" data-value="2">$$</button>
            <button type="button" data-value="3">$$$</button>
            <button type="button" data-value="4">$$$$</button>
            <button type="button" data-value="">—</button>
          </div>
        </div>

        <!-- Been there only: you cannot rate, date or re-visit a place you have not been to. -->
        <div class="field-group" id="visited-only">
          <div class="field">
            <div class="field-head">
              <span class="field-label">Rating</span>
              <div class="field-head-actions">
                <!-- The buttons are for the common case; this is for the score
                     that falls between two of them. -->
                <input id="f-rating-exact" class="rating-exact" type="number"
                       inputmode="decimal" min="1" max="10" step="0.1"
                       placeholder="8.5" aria-label="Exact rating" />
                <button type="button" class="link-btn small" id="f-rating-clear" data-value="">Clear</button>
              </div>
            </div>
            <!-- Two rows of five: ten segments across a phone would give ~36px tap
                 targets, and a mis-tap between 7 and 8 is exactly the one that matters. -->
            <div class="scale" id="f-rating" role="radiogroup" aria-label="Rating">
              <div class="segmented">
                <button type="button" role="radio" aria-checked="false" data-value="1">1</button>
                <button type="button" role="radio" aria-checked="false" data-value="2">2</button>
                <button type="button" role="radio" aria-checked="false" data-value="3">3</button>
                <button type="button" role="radio" aria-checked="false" data-value="4">4</button>
                <button type="button" role="radio" aria-checked="false" data-value="5">5</button>
              </div>
              <div class="segmented">
                <button type="button" role="radio" aria-checked="false" data-value="6">6</button>
                <button type="button" role="radio" aria-checked="false" data-value="7">7</button>
                <button type="button" role="radio" aria-checked="false" data-value="8">8</button>
                <button type="button" role="radio" aria-checked="false" data-value="9">9</button>
                <button type="button" role="radio" aria-checked="false" data-value="10">10</button>
              </div>
            </div>
            <p class="hint" id="f-rating-hint" hidden></p>
          </div>

          <label class="field">
            <span>Date visited</span>
            <input id="f-visit-date" type="date" />
          </label>

          <label class="switch-row">
            <span>Would go back</span>
            <input id="f-would-return" type="checkbox" />
          </label>
        </div>

        <!-- Want to go only: where the recommendation came from. -->
        <div class="field-group" id="wishlist-only">
          <label class="field">
            <span>Recommended by / source</span>
            <input id="f-source" type="text" placeholder="Sarah, Nashville Scene, a TikTok…" />
          </label>
        </div>

        <label class="field">
          <span>Notes</span>
          <textarea id="f-notes" rows="4" placeholder="What you ordered, who you went with, what to get next time…"></textarea>
        </label>

        <div class="field">
          <span class="field-label">Tags</span>
          <div class="lookup tag-box" id="tag-box">
            <div class="tag-chips" id="tag-chips"></div>
            <input id="f-tag-entry" type="text" autocomplete="off" autocorrect="off"
                   spellcheck="false" role="combobox" aria-expanded="false"
                   aria-controls="tag-suggestions" aria-autocomplete="list"
                   aria-label="Add a tag" placeholder="date night, patio…" />
            <ul class="lookup-menu up" id="tag-suggestions" role="listbox" hidden></ul>
          </div>
        </div>

        <button type="button" class="danger-btn" id="delete-btn" hidden>Delete this place</button>
      </div>
    </form>
  </div>

  <div class="sheet-backdrop" id="people-sheet" hidden>
    <div class="sheet" role="dialog" aria-label="Lists">
      <div class="sheet-head">
        <!-- Balances "Done" so the title sits centred, the way the place sheet's
             Cancel/Save pair does. -->
        <span class="link-btn sheet-spacer" aria-hidden="true">Done</span>
        <strong>Lists</strong>
        <button type="button" class="link-btn strong" id="people-close">Done</button>
      </div>

      <div class="sheet-body">
        <ul class="people" id="people-list"></ul>

        <details class="account-box" id="account-box">
          <summary>Change my password</summary>
          <form id="password-form">
            <input id="pw-current" type="password" autocomplete="current-password"
                   placeholder="Current password" required />
            <input id="pw-next" type="password" autocomplete="new-password"
                   placeholder="New password" required />
            <button type="submit" class="link-btn strong" id="pw-submit">Change it</button>
            <p class="hint">This signs out your other devices, but not this one.</p>
          </form>
        </details>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
